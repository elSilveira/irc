network:
    name: EduardoIRC

server:
    name: irc.eduardosilveira.dev
    listeners:
        ":6667":
        ":6697":
            tls:
                cert: /etc/letsencrypt/live/irc.eduardosilveira.dev/fullchain.pem
                key: /etc/letsencrypt/live/irc.eduardosilveira.dev/privkey.pem
            proxy: false
            min-tls-version: 1.2
    motd: ircd.motd
    sts:
        enabled: false
        duration: 0
        port: 6697
        preload: false
    lookup-hostnames: false
    check-ident: false
    coerce-ident: "~u"
    max-sendq: 96KB
    ip-limits:
        count: true
        max-concurrent-connections: 8
        throttle: true
        window: 10m
        max-connections-per-window: 16
        exempted:
            - "localhost"
            - "172.16.0.0/12"

accounts:
    authentication-enabled: true
    registration:
        enabled: true
        allow-before-connect: true
        throttling:
            enabled: true
            duration: 10m
            max-attempts: 30
        bcrypt-cost: 4
        email-verification:
            enabled: false
    login-throttling:
        enabled: true
        duration: 1m
        max-attempts: 3
    nick-reservation:
        enabled: true
        method: strict
        allow-custom-enforcement: true
        rename-timeout: 30s
        rename-prefix: "Guest-"

channels:
    default-modes: +ntC
    max-channels-per-client: 100
    registration:
        enabled: true
        operator-only: false
        max-channels-per-account: 15
    list-delay: 0s

oper-classes:
    "chat-moderator":
        title: Chat Moderator
        capabilities:
            - "kill"
            - "ban"
            - "nofakelag"
            - "relaymsg"
            - "vhosts"
            - "sajoin"
            - "samode"
            - "snomasks"
    "server-admin":
        title: Server Admin
        extends: "chat-moderator"
        capabilities:
            - "rehash"
            - "accreg"
            - "chanreg"
            - "history"
            - "defcon"
            - "massmessage"
            - "metadata"

opers:
    admin:
        class: "server-admin"
        hidden: true
        whois-line: is the server administrator
        # Replace this example hash before public launch:
        # docker compose run --rm ergo genpasswd
        password: "$2a$04$0123456789abcdef0123456789abcdef0123456789abcdef01234"

logging:
    -
        method: stderr
        type: "* -userinput -useroutput"
        level: info

datastore:
    path: /ircd-data/ircd.db
    autoupgrade: true

languages:
    enabled: true
    default: en
    path: /ircd-bin/languages

limits:
    nicklen: 32
    identlen: 20
    realnamelen: 150
    channellen: 64
    awaylen: 390
    kicklen: 390
    topiclen: 390
    monitor-entries: 100
    whowas-entries: 100
    chan-list-modes: 100
    registration-messages: 1024
    multiline:
        max-bytes: 4096
        max-lines: 100

history:
    enabled: true
    channel-length: 2048
    client-length: 256
    autoresize-window: 3d
    autoreplay-on-join: 0
    chathistory-maxmessages: 1000
    restrictions:
        expire-time: 1w
        query-cutoff: "none"
        grace-period: 1h

allow-environment-overrides: true
