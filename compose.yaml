services:
  ergo:
    image: ghcr.io/ergochat/ergo:stable
    container_name: ergo-ircd
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:6667:6667/tcp"
      - "6697:6697/tcp"
    volumes:
      - ./data/ergo:/ircd-data
      - ./config/ergo/ircd.yaml:/ircd/ircd.yaml:ro
      - ./config/ergo/ircd.motd:/ircd/ircd.motd:ro
      - ./certs/letsencrypt:/etc/letsencrypt:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - irc

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    ports:
      - "80:80/tcp"
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certs/lib:/var/lib/letsencrypt
      - ./certs/log:/var/log/letsencrypt
    entrypoint: certbot
    networks:
      - irc

networks:
  irc:
    driver: bridge
